<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Socioemocional - TutorConecta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { display: flex; height: 100vh; background-color: #E4F2FF; }
        
        .sidebar { width: 220px; background-color: #123F78; color: white; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar .brand { font-size: 18px; font-weight: 600; padding: 0 20px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar nav { margin-top: 15px; display: flex; flex-direction: column; }
        .sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: white; text-decoration: none; font-size: 13px; }
        .sidebar nav a:hover, .sidebar nav a.active { background-color: #347FE3; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        header { background-color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-profile { font-size: 14px; color: #123F78; font-weight: 600; }
        
        .container { padding: 30px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 6px rgba(18,63,120,0.04); }
        h2 { color: #123F78; font-size: 20px; margin-bottom: 15px; }
        p { font-size: 13px; color: #555; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; color: #123F78; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        
        .btn { background-color: #123F78; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
        .btn:hover { background-color: #347FE3; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">TutorConecta</div>
        <nav>
            <a href="/bienvenida?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Inicio</a>
            <a href="/calificaciones?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Calificaciones</a>
            <a href="/tareas?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Tareas</a>
            <a href="/asistencia?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Asistencia</a>
            <a href="/avisos?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Avisos</a>
            <a href="/calendario?usuario={{ usuario }}&tipo={{ tipo }}&hijo={{ hijo }}">Calendario</a>
            <a href="/" style="margin-top: 30px; color: #ff9999;">Cerrar sesion</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <span style="font-size: 20px; color: #123F78;">Menu</span>
            <div class="user-profile">Rol: {{ tipo }} | Alumno: {{ hijo }}</div>
        </header>

        <div class="container">
            <div class="card">
                <h2>Registro Socioemocional y Fortalezas</h2>
                <p>Escribe 3 fortalezas principales observadas en el desarrollo de tu hijo(a) para reflejarlas en su expediente académico.</p>

                <form method="POST">
                    <div class="input-group">
                        <label>Fortaleza 1:</label>
                        <input type="text" name="f1" value="{{ fortalezas[0] if fortalezas|length > 0 else '' }}" placeholder="Ej. Creativo" required>
                    </div>
                    <div class="input-group">
                        <label>Fortaleza 2:</label>
                        <input type="text" name="f2" value="{{ fortalezas[1] if fortalezas|length > 1 else '' }}" placeholder="Ej. Responsable" required>
                    </div>
                    <div class="input-group">
                        <label>Fortaleza 3:</label>
                        <input type="text" name="f3" value="{{ fortalezas[2] if fortalezas|length > 2 else '' }}" placeholder="Ej. Empático" required>
                    </div>

                    <button type="submit" class="btn">Guardar y Continuar</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
