<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contrasena - TutorConecta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #f0f4f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 24px rgba(18, 63, 120, 0.12); width: 420px; text-align: center; }
        h2 { color: #123F78; margin-bottom: 15px; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }
        .btn { display: inline-block; padding: 10px 20px; background-color: #347FE3; color: white; border-radius: 5px; text-decoration: none; font-weight: 600; }
        .btn:hover { background-color: #123F78; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Recuperacion de Contrasena</h2>
        <p>Por motivos de seguridad, si olvidaste tu contrasena debes <strong>solicitarla directamente a la institucion educativa</strong> con el personal administrativo.</p>
        <a href="/" class="btn">Regresar al Login</a>
    </div>
</body>
</html>
